<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>认证系统测试 - 我们的小宇宙</title>
    <style>
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a2a 0%, #000814 50%, #000000 100%);
            color: #9bb5ff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(10, 10, 42, 0.9);
            border: 1px solid rgba(155, 181, 255, 0.3);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            text-align: center;
            background: linear-gradient(135deg, #9bb5ff, #ff69b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
        }
        
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(155, 181, 255, 0.2);
        }
        
        .test-section h2 {
            color: #ff69b4;
            margin-top: 0;
            border-bottom: 1px solid rgba(155, 181, 255, 0.3);
            padding-bottom: 10px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(155, 181, 255, 0.4);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .result.success {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
        }
        
        .result.error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
        }
        
        .result.info {
            background: rgba(155, 181, 255, 0.1);
            border: 1px solid #9bb5ff;
            color: #9bb5ff;
        }
        
        .result.warning {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid #ffc107;
            color: #ffc107;
        }
        
        input, select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(155, 181, 255, 0.3);
            border-radius: 6px;
            padding: 10px;
            color: #9bb5ff;
            font-size: 14px;
            margin: 5px;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #ff69b4;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.3);
        }
        
        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .status.success { background: #00ff88; color: #000; }
        .status.error { background: #ff6b6b; color: white; }
        .status.info { background: #9bb5ff; color: #000; }
        .status.warning { background: #ffc107; color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 认证系统测试</h1>
        
        <div class="test-section">
            <h2>1. 配置加载测试</h2>
            <button id="test-config">测试配置模块</button>
            <div id="config-result" class="result" style="display: none;"></div>
        </div>
        
        <div class="test-section">
            <h2>2. 认证管理器初始化</h2>
            <button id="init-auth">初始化认证管理器</button>
            <div id="init-result" class="result" style="display: none;"></div>
        </div>
        
        <div class="test-section">
            <h2>3. 安全问题验证</h2>
            <div>
                <input type="text" id="month-input" placeholder="月份 (1-12)" value="1">
                <input type="text" id="nickname-input" placeholder="昵称" value="宝宝">
                <select id="word-select">
                    <option value="星星">星星</option>
                    <option value="月亮">月亮</option>
                    <option value="太阳">太阳</option>
                    <option value="宇宙" selected>宇宙</option>
                </select>
            </div>
            <button id="test-security">验证安全问题</button>
            <div id="security-result" class="result" style="display: none;"></div>
        </div>
        
        <div class="test-section">
            <h2>4. 会话管理</h2>
            <button id="test-session">检查会话</button>
            <button id="test-profile">获取用户资料</button>
            <button id="test-permissions">检查权限</button>
            <div id="session-result" class="result" style="display: none;"></div>
        </div>
        
        <div class="test-section">
            <h2>5. 令牌管理</h2>
            <button id="test-tokens">查看令牌</button>
            <button id="test-refresh">刷新令牌</button>
            <button id="test-clear">清除令牌</button>
            <div id="token-result" class="result" style="display: none;"></div>
        </div>
        
        <div class="test-section">
            <h2>6. API 访问测试</h2>
            <button id="test-api">测试 API 访问</button>
            <button id="test-upload-perm">测试上传权限</button>
            <div id="api-result" class="result" style="display: none;"></div>
        </div>
    </div>
    
    <script type="module">
        import { CONFIG } from './js/config.js';
        import AuthManager from './js/authManager.js';
        
        let authManager = null;
        
        // 日志函数
        function log(resultDiv, message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const className = type;
            
            resultDiv.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            resultDiv.style.display = 'block';
            resultDiv.scrollTop = resultDiv.scrollHeight;
        }
        
        // 1. 测试配置模块
        document.getElementById('test-config').addEventListener('click', () => {
            const resultDiv = document.getElementById('config-result');
            resultDiv.innerHTML = '';
            
            try {
                log(resultDiv, `配置加载成功！`, 'success');
                log(resultDiv, `纪念日: ${CONFIG.memorial.startDate.toLocaleDateString()}`, 'info');
                log(resultDiv, `照片数量: ${CONFIG.photos.photoCount}`, 'info');
                log(resultDiv, `主题数量: ${CONFIG.themes.moods.length}`, 'info');
            } catch (error) {
                log(resultDiv, `配置加载失败: ${error.message}`, 'error');
            }
        });
        
        // 2. 初始化认证管理器
        document.getElementById('init-auth').addEventListener('click', async () => {
            const resultDiv = document.getElementById('init-result');
            resultDiv.innerHTML = '';
            
            try {
                authManager = new AuthManager(CONFIG);
                await authManager.initialize();
                
                log(resultDiv, '认证管理器初始化成功！', 'success');
                log(resultDiv, `当前认证状态: ${authManager.isAuthenticated() ? '已登录' : '未登录'}`, 'info');
                
            } catch (error) {
                log(resultDiv, `初始化失败: ${error.message}`, 'error');
            }
        });
        
        // 3. 测试安全问题验证
        document.getElementById('test-security').addEventListener('click', async () => {
            const resultDiv = document.getElementById('security-result');
            resultDiv.innerHTML = '';
            
            if (!authManager) {
                log(resultDiv, '请先初始化认证管理器！', 'error');
                return;
            }
            
            const month = document.getElementById('month-input').value;
            const nickname = document.getElementById('nickname-input').value;
            const word = document.getElementById('word-select').value;
            
            try {
                log(resultDiv, `正在验证: 月份=${month}, 昵称=${nickname}, 心动词=${word}`, 'info');
                
                const result = await authManager.verifySecurityQuestions({
                    month,
                    nickname,
                    word
                });
                
                if (result.success) {
                    log(resultDiv, `✅ 验证成功！欢迎进入我们的小宇宙！`, 'success');
                    log(resultDiv, `用户: ${result.data.user.displayName}`, 'info');
                    log(resultDiv, `令牌: ${result.data.tokens.accessToken ? '已生成' : '未生成'}`, 'info');
                } else {
                    log(resultDiv, `❌ 验证失败: ${result.message}`, 'error');
                    log(resultDiv, `提示: 答案藏在你们的回忆里 💕`, 'warning');
                }
                
            } catch (error) {
                log(resultDiv, `验证出错: ${error.message}`, 'error');
            }
        });
        
        // 4. 测试会话管理
        document.getElementById('test-session').addEventListener('click', async () => {
            const resultDiv = document.getElementById('session-result');
            resultDiv.innerHTML = '';
            
            if (!authManager) {
                log(resultDiv, '请先初始化认证管理器！', 'error');
                return;
            }
            
            try {
                const result = await authManager.checkSession();
                
                if (result.success) {
                    log(resultDiv, '✅ 会话有效', 'success');
                    log(resultDiv, `用户: ${JSON.stringify(result.data, null, 2)}`, 'info');
                } else {
                    log(resultDiv, `❌ 会话无效: ${result.message}`, 'error');
                }
                
            } catch (error) {
                log(resultDiv, `会话检查失败: ${error.message}`, 'error');
            }
        });
        
        document.getElementById('test-profile').addEventListener('click', async () => {
            const resultDiv = document.getElementById('session-result');
            resultDiv.innerHTML = '';
            
            if (!authManager) {
                log(resultDiv, '请先初始化认证管理器！', 'error');
                return;
            }
            
            try {
                const profile = await authManager.getUserProfile();
                log(resultDiv, '✅ 获取用户资料成功', 'success');
                log(resultDiv, `资料: ${JSON.stringify(profile, null, 2)}`, 'info');
                
            } catch (error) {
                log(resultDiv, `获取资料失败: ${error.message}`, 'error');
            }
        });
        
        document.getElementById('test-permissions').addEventListener('click', async () => {
            const resultDiv = document.getElementById('session-result');
            resultDiv.innerHTML = '';
            
            if (!authManager) {
                log(resultDiv, '请先初始化认证管理器！', 'error');
                return;
            }
            
            try {
                const canView = await authManager.hasPermission('view:photos');
                const canUpload = await authManager.hasPermission('upload:photos');
                const canManage = await authManager.hasPermission('manage:photos');
                
                log(resultDiv, '✅ 权限检查完成', 'success');
                log(resultDiv, `查看照片: ${canView ? '✓' : '✗'}`, canView ? 'success' : 'error');
                log(resultDiv, `上传照片: ${canUpload ? '✓' : '✗'}`, canUpload ? 'success' : 'error');
                log(resultDiv, `管理照片: ${canManage ? '✓' : '✗'}`, canManage ? 'success' : 'error');
                
            } catch (error) {
                log(resultDiv, `权限检查失败: ${error.message}`, 'error');
            }
        });
        
        // 5. 测试令牌管理
        document.getElementById('test-tokens').addEventListener('click', () => {
            const resultDiv = document.getElementById('token-result');
            resultDiv.innerHTML = '';
            
            if (!authManager) {
                log(resultDiv, '请先初始化认证管理器！', 'error');
                return;
            }
            
            const status = authManager.getAuthStatus();
            log(resultDiv, '✅ 令牌状态', 'success');
            log(resultDiv, `认证状态: ${JSON.stringify(status, null, 2)}`, 'info');
        });
        
        document.getElementById('test-refresh').addEventListener('click', async () => {
            const resultDiv = document.getElementById('token-result');
            resultDiv.innerHTML = '';
            
            if (!authManager) {
                log(resultDiv, '请先初始化认证管理器！', 'error');
                return;
            }
            
            try {
                const success = await authManager.refreshTokens();
                log(resultDiv, success ? '✅ 令牌刷新成功' : '❌ 令牌刷新失败', success ? 'success' : 'error');
                
            } catch (error) {
                log(resultDiv, `刷新失败: ${error.message}`, 'error');
            }
        });
        
        document.getElementById('test-clear').addEventListener('click', () => {
            const resultDiv = document.getElementById('token-result');
            resultDiv.innerHTML = '';
            
            if (!authManager) {
                log(resultDiv, '请先初始化认证管理器！', 'error');
                return;
            }
            
            authManager.clearTokens();
            log(resultDiv, '✅ 令牌已清除', 'success');
        });
        
        // 6. 测试 API 访问
        document.getElementById('test-api').addEventListener('click', async () => {
            const resultDiv = document.getElementById('api-result');
            resultDiv.innerHTML = '';
            
            try {
                const response = await fetch('/api/photos');
                log(resultDiv, `API 响应状态: ${response.status}`, response.ok ? 'success' : 'error');
                
                if (response.ok) {
                    const result = await response.json();
                    log(resultDiv, `✅ 获取到 ${result.data?.photos?.length || 0} 张照片`, 'success');
                } else {
                    const error = await response.json();
                    log(resultDiv, `❌ 错误: ${error.message}`, 'error');
                }
                
            } catch (error) {
                log(resultDiv, `API 访问失败: ${error.message}`, 'error');
            }
        });
        
        document.getElementById('test-upload-perm').addEventListener('click', async () => {
            const resultDiv = document.getElementById('api-result');
            resultDiv.innerHTML = '';
            
            if (!authManager) {
                log(resultDiv, '请先初始化认证管理器！', 'error');
                return;
            }
            
            try {
                const hasPermission = await authManager.hasPermission('upload:photos');
                log(resultDiv, `上传权限: ${hasPermission ? '✓ 有权限' : '✗ 无权限'}`, 
                    hasPermission ? 'success' : 'error');
                
                if (hasPermission) {
                    log(resultDiv, '正在测试上传API访问...', 'info');
                    
                    const response = await fetch('/api/upload/photos', {
                        method: 'OPTIONS'
                    });
                    
                    log(resultDiv, `上传API响应: ${response.status}`, 
                        response.ok ? 'success' : 'error');
                } else {
                    log(resultDiv, '没有上传权限，无法测试上传API', 'warning');
                }
                
            } catch (error) {
                log(resultDiv, `权限测试失败: ${error.message}`, 'error');
            }
        });
    </script>
</body>
</html>
