<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片上传 - 我们的小宇宙</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 50%, #2a1a4a 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #9bb5ff;
            font-size: 16px;
            opacity: 0.9;
        }
        
        .upload-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .upload-area {
            position: relative;
            border: 3px dashed #667eea;
            border-radius: 20px;
            padding: 60px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(102, 126, 234, 0.05);
        }
        
        .upload-area.dragover {
            border-color: #f093fb;
            background: rgba(240, 147, 251, 0.1);
            transform: scale(1.02);
        }
        
        .upload-area.uploading {
            pointer-events: none;
            opacity: 0.8;
        }
        
        .upload-icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #667eea;
        }
        
        .upload-text h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #e0e7ff;
        }
        
        .upload-text p {
            font-size: 16px;
            color: #9bb5ff;
            margin-bottom: 20px;
        }
        
        .upload-hint {
            font-size: 14px;
            color: #8191ff;
            opacity: 0.8;
        }
        
        #fileInput {
            display: none;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
        }
        
        .progress-section {
            margin-top: 30px;
            display: none;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }
        
        .progress-text {
            text-align: center;
            color: #e0e7ff;
            font-size: 14px;
        }
        
        .preview-section {
            margin-top: 30px;
        }
        
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .preview-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .preview-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }
        
        .preview-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        
        .preview-info {
            font-size: 12px;
            color: #9bb5ff;
        }
        
        .preview-name {
            font-weight: 500;
            color: #e0e7ff;
            margin-bottom: 5px;
            word-break: break-all;
        }
        
        .preview-size {
            opacity: 0.8;
        }
        
        .preview-status {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .preview-status.uploading {
            background: #fbbf24;
            color: #92400e;
        }
        
        .preview-status.success {
            background: #10b981;
            color: white;
        }
        
        .preview-status.error {
            background: #ef4444;
            color: white;
        }
        
        .remove-btn {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 25px;
            height: 25px;
            background: #ef4444;
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            transition: all 0.3s ease;
        }
        
        .remove-btn:hover {
            background: #dc2626;
            transform: scale(1.1);
        }
        
        .upload-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .stats-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #f093fb;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #9bb5ff;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(16, 185, 129, 0.9);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.error {
            background: rgba(239, 68, 68, 0.9);
        }
        
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .upload-section {
                padding: 20px;
            }
            
            .upload-area {
                padding: 40px 10px;
            }
            
            .upload-icon {
                font-size: 48px;
            }
            
            .upload-text h3 {
                font-size: 20px;
            }
            
            .preview-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }
            
            .upload-controls {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">←</a>
    
    <div class="container">
        <div class="header">
            <h1>📸 照片上传</h1>
            <p>将美好的回忆添加到我们的小宇宙中</p>
        </div>
        
        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">☁️</div>
                <div class="upload-text">
                    <h3>拖拽照片到这里</h3>
                    <p>或者点击选择文件</p>
                    <div class="upload-hint">
                        支持 JPG、PNG、WebP、GIF 格式，单个文件最大 10MB
                    </div>
                </div>
                <input type="file" id="fileInput" multiple accept="image/*">
            </div>
            
            <div class="progress-section" id="progressSection">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">准备上传...</div>
            </div>
        </div>
        
        <div class="preview-section" id="previewSection" style="display: none;">
            <h3>📋 待上传照片</h3>
            <div class="preview-grid" id="previewGrid"></div>
            
            <div class="upload-controls">
                <button class="btn" id="uploadBtn">🚀 开始上传</button>
                <button class="btn btn-secondary" id="clearBtn">🗑️ 清空列表</button>
            </div>
        </div>
        
        <div class="stats-section" id="statsSection" style="display: none;">
            <h3>📊 上传统计</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalFiles">0</div>
                    <div class="stat-label">总文件数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalSize">0 MB</div>
                    <div class="stat-label">总大小</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="successCount">0</div>
                    <div class="stat-label">上传成功</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="compressionRatio">0%</div>
                    <div class="stat-label">压缩比例</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification"></div>

    <script>
        class PhotoUploader {
            constructor() {
                this.files = [];
                this.uploadedCount = 0;
                this.totalSize = 0;
                this.compressedSize = 0;
                
                this.initializeElements();
                this.bindEvents();
            }
            
            initializeElements() {
                this.uploadArea = document.getElementById('uploadArea');
                this.fileInput = document.getElementById('fileInput');
                this.progressSection = document.getElementById('progressSection');
                this.progressFill = document.getElementById('progressFill');
                this.progressText = document.getElementById('progressText');
                this.previewSection = document.getElementById('previewSection');
                this.previewGrid = document.getElementById('previewGrid');
                this.uploadBtn = document.getElementById('uploadBtn');
                this.clearBtn = document.getElementById('clearBtn');
                this.statsSection = document.getElementById('statsSection');
                this.notification = document.getElementById('notification');
            }
            
            bindEvents() {
                // 拖拽事件
                this.uploadArea.addEventListener('dragover', this.handleDragOver.bind(this));
                this.uploadArea.addEventListener('dragleave', this.handleDragLeave.bind(this));
                this.uploadArea.addEventListener('drop', this.handleDrop.bind(this));
                
                // 点击上传
                this.uploadArea.addEventListener('click', () => {
                    this.fileInput.click();
                });
                
                // 文件选择
                this.fileInput.addEventListener('change', this.handleFileSelect.bind(this));
                
                // 按钮事件
                this.uploadBtn.addEventListener('click', this.startUpload.bind(this));
                this.clearBtn.addEventListener('click', this.clearFiles.bind(this));
                
                // 防止页面默认拖拽行为
                document.addEventListener('dragover', e => e.preventDefault());
                document.addEventListener('drop', e => e.preventDefault());
            }
            
            handleDragOver(e) {
                e.preventDefault();
                this.uploadArea.classList.add('dragover');
            }
            
            handleDragLeave(e) {
                e.preventDefault();
                if (!this.uploadArea.contains(e.relatedTarget)) {
                    this.uploadArea.classList.remove('dragover');
                }
            }
            
            handleDrop(e) {
                e.preventDefault();
                this.uploadArea.classList.remove('dragover');
                
                const files = Array.from(e.dataTransfer.files);
                this.addFiles(files);
            }
            
            handleFileSelect(e) {
                const files = Array.from(e.target.files);
                this.addFiles(files);
                // 清空input，以便重复选择相同文件
                e.target.value = '';
            }
            
            addFiles(newFiles) {
                const validFiles = newFiles.filter(file => {
                    // 检查文件类型
                    if (!file.type.startsWith('image/')) {
                        this.showNotification(`${file.name} 不是有效的图片文件`, 'error');
                        return false;
                    }
                    
                    // 检查文件大小 (10MB)
                    if (file.size > 10 * 1024 * 1024) {
                        this.showNotification(`${file.name} 文件大小超过 10MB`, 'error');
                        return false;
                    }
                    
                    // 检查是否已存在
                    const exists = this.files.some(f => 
                        f.name === file.name && f.size === file.size
                    );
                    if (exists) {
                        this.showNotification(`${file.name} 已存在于列表中`, 'error');
                        return false;
                    }
                    
                    return true;
                });
                
                if (validFiles.length === 0) return;
                
                // 添加文件到列表
                validFiles.forEach(file => {
                    const fileObj = {
                        id: Date.now() + Math.random(),
                        file,
                        name: file.name,
                        size: file.size,
                        status: 'pending' // pending, uploading, success, error
                    };
                    this.files.push(fileObj);
                });
                
                this.updatePreview();
                this.updateStats();
                this.showNotification(`添加了 ${validFiles.length} 个文件`);
            }
            
            updatePreview() {
                if (this.files.length === 0) {
                    this.previewSection.style.display = 'none';
                    return;
                }
                
                this.previewSection.style.display = 'block';
                this.previewGrid.innerHTML = '';
                
                this.files.forEach(fileObj => {
                    const previewItem = this.createPreviewItem(fileObj);
                    this.previewGrid.appendChild(previewItem);
                });
            }
            
            createPreviewItem(fileObj) {
                const item = document.createElement('div');
                item.className = 'preview-item';
                item.dataset.fileId = fileObj.id;
                
                // 创建预览图
                const img = document.createElement('img');
                img.className = 'preview-image';
                img.src = URL.createObjectURL(fileObj.file);
                
                // 文件信息
                const info = document.createElement('div');
                info.className = 'preview-info';
                info.innerHTML = `
                    <div class="preview-name">${fileObj.name}</div>
                    <div class="preview-size">${this.formatFileSize(fileObj.size)}</div>
                `;
                
                // 状态指示器
                const status = document.createElement('div');
                status.className = `preview-status ${fileObj.status}`;
                status.innerHTML = this.getStatusIcon(fileObj.status);
                
                // 删除按钮
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.innerHTML = '×';
                removeBtn.addEventListener('click', () => {
                    this.removeFile(fileObj.id);
                });
                
                item.appendChild(img);
                item.appendChild(info);
                item.appendChild(status);
                item.appendChild(removeBtn);
                
                return item;
            }
            
            getStatusIcon(status) {
                const icons = {
                    pending: '⏳',
                    uploading: '⬆️',
                    success: '✅',
                    error: '❌'
                };
                return icons[status] || '⏳';
            }
            
            removeFile(fileId) {
                this.files = this.files.filter(f => f.id !== fileId);
                this.updatePreview();
                this.updateStats();
            }
            
            clearFiles() {
                this.files = [];
                this.updatePreview();
                this.updateStats();
                this.showNotification('已清空文件列表');
            }
            
            async startUpload() {
                if (this.files.length === 0) {
                    this.showNotification('请先选择要上传的文件', 'error');
                    return;
                }
                
                this.uploadBtn.disabled = true;
                this.uploadBtn.textContent = '上传中...';
                this.progressSection.style.display = 'block';
                
                this.uploadedCount = 0;
                this.compressedSize = 0;
                
                try {
                    await this.uploadFiles();
                    this.showNotification('所有文件上传完成！');
                } catch (error) {
                    this.showNotification('上传过程中发生错误', 'error');
                } finally {
                    this.uploadBtn.disabled = false;
                    this.uploadBtn.textContent = '🚀 开始上传';
                    this.progressSection.style.display = 'none';
                }
            }
            
            async uploadFiles() {
                const total = this.files.length;
                
                for (let i = 0; i < total; i++) {
                    const fileObj = this.files[i];
                    
                    try {
                        // 更新状态
                        fileObj.status = 'uploading';
                        this.updateFileStatus(fileObj.id, 'uploading');
                        
                        // 更新进度
                        const progress = (i / total) * 100;
                        this.updateProgress(progress, `上传中: ${fileObj.name}`);
                        
                        // 执行上传
                        const result = await this.uploadSingleFile(fileObj.file);
                        
                        // 上传成功
                        fileObj.status = 'success';
                        this.updateFileStatus(fileObj.id, 'success');
                        this.uploadedCount++;
                        
                        // 如果是第一个成功上传的文件，显示刷新提示
                        if (this.uploadedCount === 1) {
                            this.showNotification('上传成功！请刷新主页面查看新照片 🎉', 'success');
                        }
                        
                        // 累计压缩后大小（从服务器响应获取）
                        if (result.data && result.data.photos) {
                            result.data.photos.forEach(photo => {
                                if (photo.paths && photo.paths.medium) {
                                    // 这里可以从服务器获取压缩后的大小
                                    // 暂时使用估算值
                                    this.compressedSize += Math.round(fileObj.file.size * 0.7);
                                }
                            });
                        }
                        
                    } catch (error) {
                        fileObj.status = 'error';
                        this.updateFileStatus(fileObj.id, 'error');
                        console.error(`上传 ${fileObj.name} 失败:`, error);
                    }
                }
                
                // 完成进度
                this.updateProgress(100, '上传完成！');
                this.updateStats();
                this.statsSection.style.display = 'block';
            }
            
            async uploadSingleFile(file) {
                const formData = new FormData();
                formData.append('photos', file);
                formData.append('title', file.name);
                formData.append('description', `上传于 ${new Date().toLocaleString()}`);
                
                const response = await fetch('/api/upload/photos', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || '上传失败');
                }
                
                return await response.json();
            }
            
            updateFileStatus(fileId, status) {
                const item = document.querySelector(`[data-file-id="${fileId}"]`);
                if (item) {
                    const statusEl = item.querySelector('.preview-status');
                    statusEl.className = `preview-status ${status}`;
                    statusEl.innerHTML = this.getStatusIcon(status);
                }
            }
            
            updateProgress(percent, text) {
                this.progressFill.style.width = percent + '%';
                this.progressText.textContent = text;
            }
            
            updateStats() {
                this.totalSize = this.files.reduce((sum, f) => sum + f.size, 0);
                
                document.getElementById('totalFiles').textContent = this.files.length;
                document.getElementById('totalSize').textContent = this.formatFileSize(this.totalSize);
                document.getElementById('successCount').textContent = this.uploadedCount;
                
                const compressionRatio = this.totalSize > 0 ? 
                    Math.round((1 - this.compressedSize / this.totalSize) * 100) : 0;
                document.getElementById('compressionRatio').textContent = compressionRatio + '%';
            }
            
            formatFileSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            showNotification(message, type = 'success') {
                this.notification.textContent = message;
                this.notification.className = `notification ${type}`;
                this.notification.classList.add('show');
                
                setTimeout(() => {
                    this.notification.classList.remove('show');
                }, 3000);
            }
        }
        
        // 初始化上传器
        document.addEventListener('DOMContentLoaded', () => {
            new PhotoUploader();
        });
    </script>
</body>
</html>
