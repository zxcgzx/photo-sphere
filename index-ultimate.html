<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>永恒之心 · 我们的宇宙</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Noto Serif SC', serif;
            background: #000;
            color: #fff;
            touch-action: none;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="%23ffffff" opacity="0.3"/><circle cx="12" cy="12" r="6" fill="%23ffffff" opacity="0.6"/><circle cx="12" cy="12" r="3" fill="%23ffffff"/></svg>'), auto;
        }
        
        /* 星空画布 - 多层渲染 */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
        }
        
        /* 大气层 - 体积雾效果 */
        #atmosphere-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(10, 10, 42, 0.3) 50%, rgba(0, 0, 0, 0.8) 100%);
        }
        
        /* 粒子层 - 魔法光尘 */
        #magic-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .magic-dust {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, #ffffff, #9bb5ff);
            border-radius: 50%;
            pointer-events: none;
            animation: dustFloat 8s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(155, 181, 255, 0.8);
        }
        
        @keyframes dustFloat {
            0%, 100% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
                transform: scale(1);
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100px) translateX(50px) scale(0);
            }
        }
        
        /* 主画布 */
        #canvas-container {
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        /* 标题区域 - 史诗级字体设计 */
        #title-container {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 50;
            pointer-events: none;
            animation: titleFloat 8s ease-in-out infinite;
        }
        
        @keyframes titleFloat {
            0%, 100% { transform: translateX(-50%) translateY(0px) rotate(0deg); }
            50% { transform: translateX(-50%) translateY(-15px) rotate(1deg); }
        }
        
        #main-title {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 12px;
            background: linear-gradient(135deg, 
                #ffffff 0%, 
                #9bb5ff 20%, 
                #d6b3ff 40%, 
                #ffb3d9 60%, 
                #ffcc99 80%, 
                #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-shadow: 0 0 60px rgba(155, 181, 255, 0.8);
            filter: drop-shadow(0 0 40px rgba(214, 179, 255, 0.6));
            animation: titleGlow 6s ease-in-out infinite alternate;
            font-family: 'Ma Shan Zheng', cursive;
        }
        
        @keyframes titleGlow {
            0% { filter: drop-shadow(0 0 40px rgba(214, 179, 255, 0.6)); }
            100% { filter: drop-shadow(0 0 80px rgba(155, 181, 255, 0.9)); }
        }
        
        .emoji-decoration {
            font-size: 36px;
            animation: emojiPulse 4s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.8));
        }
        
        @keyframes emojiPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.3) rotate(5deg); }
        }
        
        #subtitle {
            font-size: 16px;
            color: #d6b3ff;
            margin-top: 20px;
            opacity: 0.8;
            font-weight: 300;
            letter-spacing: 4px;
            animation: subtitleFade 12s ease-in-out infinite;
            font-family: 'ZCOOL KuaiLe', cursive;
        }
        
        @keyframes subtitleFade {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.9; }
        }
        
        /* 控制面板 - 玻璃拟态艺术 */
        #control-panel {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            border-radius: 40px;
            box-shadow: 0 15px 50px rgba(155, 181, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 90%;
            z-index: 100;
            animation: panelFloat 6s ease-in-out infinite;
        }
        
        @keyframes panelFloat {
            0%, 100% { transform: translateX(-50%) translateY(0px); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }
        
        .control-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 14px 28px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 25px rgba(155, 181, 255, 0.15);
            position: relative;
            overflow: hidden;
            font-family: 'Noto Serif SC', serif;
            font-weight: 400;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
        }
        
        .control-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.7s;
        }
        
        .control-btn:hover::before {
            left: 100%;
        }
        
        .control-btn:hover {
            transform: translateY(-8px) scale(1.08);
            box-shadow: 0 12px 40px rgba(155, 181, 255, 0.4);
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(214, 179, 255, 0.3);
        }
        
        .control-btn:active {
            transform: translateY(-3px) scale(0.98);
        }
        
        .control-btn.active {
            background: linear-gradient(135deg, rgba(155, 181, 255, 0.3), rgba(214, 179, 255, 0.3));
            border-color: rgba(155, 181, 255, 0.4);
            box-shadow: 0 0 40px rgba(155, 181, 255, 0.6);
            color: #ffffff;
        }
        
        /* 统计面板 - 时光印记 */
        #stats-panel {
            position: fixed;
            top: 140px;
            left: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            padding: 30px;
            font-size: 16px;
            box-shadow: 0 10px 40px rgba(155, 181, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            z-index: 90;
            animation: statsFade 1s ease-out;
            font-family: 'Noto Serif SC', serif;
        }
        
        @keyframes statsFade {
            0% { opacity: 0; transform: translateY(-30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 15px 0;
            color: #e0e7ff;
            transition: all 0.4s ease;
            padding: 8px;
            border-radius: 15px;
        }
        
        .stat-item:hover {
            transform: translateX(10px);
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .stat-emoji {
            font-size: 24px;
            animation: statEmojiBounce 3s ease-in-out infinite;
        }
        
        @keyframes statEmojiBounce {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.3) rotate(10deg); }
        }
        
        .stat-value {
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            font-size: 18px;
        }
        
        /* 照片查看器 - 时光胶囊 */
        #photo-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.98) 0%, rgba(10, 10, 42, 0.99) 100%);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            flex-direction: column;
            padding: 20px;
            backdrop-filter: blur(40px);
        }
        
        #viewer-close {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            z-index: 201;
        }
        
        #viewer-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg) scale(1.15);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.4);
        }
        
        #viewer-image {
            max-width: 80%;
            max-height: 55%;
            object-fit: contain;
            border-radius: 30px;
            box-shadow: 0 30px 100px rgba(155, 181, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: photoFloat 6s ease-in-out infinite;
            z-index: 200;
        }
        
        @keyframes photoFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-15px) scale(1.02); }
        }
        
        #viewer-info {
            margin-top: 40px;
            text-align: center;
            color: white;
            max-width: 700px;
            animation: infoFade 1.2s ease-out;
            z-index: 200;
        }
        
        @keyframes infoFade {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        #viewer-date {
            color: #9bb5ff;
            font-size: 18px;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(155, 181, 255, 0.6);
            font-family: 'ZCOOL KuaiLe', cursive;
            letter-spacing: 2px;
        }
        
        #viewer-caption {
            font-size: 20px;
            line-height: 1.8;
            opacity: 0.9;
            font-weight: 300;
            font-style: italic;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 1px;
        }
        
        /* 心跳背景 - 多层波纹 */
        .heartbeat-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 3s ease;
        }
        
        .heartbeat-bg.active {
            opacity: 0.4;
        }
        
        .heartbeat-pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid rgba(255, 179, 217, 0.4);
            border-radius: 50%;
            animation: heartbeat 3s ease-in-out infinite;
        }
        
        .heartbeat-pulse:nth-child(1) {
            width: 150px;
            height: 150px;
            animation-delay: 0s;
        }
        
        .heartbeat-pulse:nth-child(2) {
            width: 250px;
            height: 250px;
            animation-delay: 0.8s;
        }
        
        .heartbeat-pulse:nth-child(3) {
            width: 350px;
            height: 350px;
            animation-delay: 1.6s;
        }
        
        @keyframes heartbeat {
            0% { 
                transform: translate(-50%, -50%) scale(0.6);
                opacity: 1;
            }
            100% { 
                transform: translate(-50%, -50%) scale(4);
                opacity: 0;
            }
        }
        
        /* 加载界面 - 时空之门 */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0a2a 0%, #000814 50%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loading-orb {
            width: 200px;
            height: 200px;
            position: relative;
            margin-bottom: 50px;
        }
        
        .loading-ring {
            position: absolute;
            border: 3px solid transparent;
            border-radius: 50%;
            animation: ringRotate 4s linear infinite;
        }
        
        .loading-ring:nth-child(1) {
            width: 100%;
            height: 100%;
            border-top-color: #9bb5ff;
            border-bottom-color: #d6b3ff;
            animation-duration: 4s;
        }
        
        .loading-ring:nth-child(2) {
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
            border-left-color: #ffb3d9;
            border-right-color: #ffcc99;
            animation-duration: 3s;
            animation-direction: reverse;
        }
        
        .loading-ring:nth-child(3) {
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
            border-top-color: #ffffff;
            border-bottom-color: #9bb5ff;
            animation-duration: 2s;
        }
        
        .loading-core {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #ffffff, #9bb5ff);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 40px rgba(155, 181, 255, 1);
            animation: corePulse 2s ease-in-out infinite;
        }
        
        @keyframes ringRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes corePulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 0 40px rgba(155, 181, 255, 1);
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.3);
                box-shadow: 0 0 60px rgba(214, 179, 255, 1);
            }
        }
        
        #loading-text {
            color: #e0e7ff;
            font-size: 20px;
            text-shadow: 0 0 30px rgba(155, 181, 255, 0.6);
            letter-spacing: 4px;
            font-weight: 300;
            margin-bottom: 30px;
            font-family: 'Noto Serif SC', serif;
        }
        
        .loading-quote {
            color: #d6b3ff;
            font-size: 16px;
            font-style: italic;
            opacity: 0.8;
            max-width: 500px;
            text-align: center;
            line-height: 1.8;
            margin-top: 30px;
            font-family: 'ZCOOL KuaiLe', cursive;
            letter-spacing: 1px;
        }
        
        #loading-progress {
            width: 350px;
            height: 6px;
            background-color: rgba(155, 181, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 40px;
        }
        
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #9bb5ff, #d6b3ff, #ffb3d9, #ffcc99);
            transition: width 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
            border-radius: 3px;
            box-shadow: 0 0 30px rgba(155, 181, 255, 0.8);
        }
        
        /* 手势提示 - 诗意化 */
        #gesture-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(30px);
            color: white;
            padding: 40px 50px;
            border-radius: 30px;
            font-size: 20px;
            z-index: 150;
            display: none;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(155, 181, 255, 0.3);
            animation: hintPulse 4s ease-in-out infinite;
            font-family: 'Noto Serif SC', serif;
            line-height: 1.8;
            max-width: 80%;
        }
        
        @keyframes hintPulse {
            0%, 100% { 
                opacity: 0.9;
                box-shadow: 0 20px 60px rgba(155, 181, 255, 0.3);
            }
            50% { 
                opacity: 1;
                box-shadow: 0 20px 80px rgba(155, 181, 255, 0.5);
            }
        }
        
        .hint-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: iconFloat 3s ease-in-out infinite;
        }
        
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            #main-title {
                font-size: 28px;
                letter-spacing: 6px;
            }
            
            .emoji-decoration {
                font-size: 24px;
            }
            
            #subtitle {
                font-size: 12px;
                letter-spacing: 2px;
            }
            
            #control-panel {
                bottom: 20px;
                padding: 15px;
                gap: 8px;
                border-radius: 25px;
            }
            
            .control-btn {
                padding: 10px 16px;
                font-size: 11px;
                min-width: auto;
            }
            
            #stats-panel {
                top: 100px;
                left: 20px;
                padding: 20px;
                font-size: 12px;
            }
        }
        
        @media (max-width: 480px) {
            #main-title {
                font-size: 20px;
                letter-spacing: 4px;
            }
            
            .control-btn {
                padding: 8px 12px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <canvas id="stars-canvas"></canvas>
    <div id="atmosphere-layer"></div>
    <div id="magic-particles"></div>
    
    <!-- 心跳背景 -->
    <div class="heartbeat-bg" id="heartbeat-bg">
        <div class="heartbeat-pulse"></div>
        <div class="heartbeat-pulse"></div>
        <div class="heartbeat-pulse"></div>
    </div>
    
    <div id="canvas-container"></div>
    
    <div id="title-container">
        <h1 id="main-title">
            <span class="emoji-decoration">💖</span>
            <span>永恒之心</span>
            <span class="emoji-decoration">✨</span>
        </h1>
        <div id="subtitle">在时间的尽头，我们相遇</div>
    </div>
    
    <div id="stats-panel">
        <div class="stat-item">
            <span class="stat-emoji">💫</span>
            <span>永恒时光 <span class="stat-value" id="days-count">0</span> 天</span>
        </div>
        <div class="stat-item">
            <span class="stat-emoji">🌟</span>
            <span>星辰记忆 <span class="stat-value" id="photo-count">0</span> 颗</span>
        </div>
        <div class="stat-item">
            <span class="stat-emoji">💕</span>
            <span>心动指数 <span class="stat-value" id="sweet-index">99</span>%</span>
        </div>
    </div>
    
    <div id="control-panel">
        <button class="control-btn" id="btn-rotate">
            <span>🌙</span>
            <span>星轨流转</span>
        </button>
        <button class="control-btn" id="btn-stats">
            <span>📜</span>
            <span>时光卷轴</span>
        </button>
        <button class="control-btn" id="btn-random">
            <span>🎲</span>
            <span>随机回忆</span>
        </button>
        <button class="control-btn" id="btn-mood">
            <span>🎨</span>
            <span>星云变幻</span>
        </button>
        <button class="control-btn" id="btn-light">
            <span>💫</span>
            <span>星光闪烁</span>
        </button>
        <button class="control-btn" id="btn-heartbeat">
            <span>💕</span>
            <span>心跳同步</span>
        </button>
        <button class="control-btn" id="btn-customizer">
            <span>💎</span>
            <span>永恒之心</span>
        </button>
        <button class="control-btn" id="btn-upload">
            <span>📸</span>
            <span>捕捉时光</span>
        </button>
    </div>
    
    <div id="photo-viewer">
        <div id="viewer-close">×</div>
        <img id="viewer-image" src="" alt="">
        <div id="viewer-info">
            <div id="viewer-date"></div>
            <div id="viewer-caption"></div>
        </div>
    </div>
    
    <div id="gesture-hint">
        <div class="hint-icon">🌌</div>
        <div>轻触星辰，唤醒回忆<br>双指轻舞，遨游星海</div>
    </div>
    
    <div id="loading-screen">
        <div class="loading-orb">
            <div class="loading-ring"></div>
            <div class="loading-ring"></div>
            <div class="loading-ring"></div>
            <div class="loading-core"></div>
        </div>
        <p id="loading-text">正在编织我们的永恒宇宙...</p>
        <div id="loading-progress">
            <div id="progress-bar"></div>
        </div>
        <div class="loading-quote" id="loading-quote">"在亿万星辰中，我找到了你"</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <script>
        // 配置 - 终极浪漫参数
        const config = {
            radius: 320,
            particleCount: 1500,

        // 初始化星空背景
        function createStarField() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // 创建深邃背景
            const gradient = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 0,
                canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height)
            );
            gradient.addColorStop(0, '#0a0a2a');
            gradient.addColorStop(0.3, '#000814');
            gradient.addColorStop(0.7, '#000000');
            gradient.addColorStop(1, '#000000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 创建5000颗星星
            for (let i = 0; i < config.starsCount; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const radius = Math.random() * 2.5;
                const opacity = Math.random() * 0.8 + 0.2;
                const twinkleSpeed = Math.random() * 0.05 + 0.01;
                
                // 星星闪烁效果
                const twinkle = Math.sin(Date.now() * twinkleSpeed + i) * 0.5 + 0.5;
                
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity * twinkle})`;
                ctx.fill();
                
                // 添加星光效果
                if (Math.random() > 0.98) {
                    const glow = ctx.createRadialGradient(x, y, 0, x, y, radius * 8);
                    glow.addColorStop(0, `rgba(155, 181, 255, ${opacity})`);
                    glow.addColorStop(0.5, `rgba(155, 181, 255, ${opacity * 0.5})`);
                    glow.addColorStop(1, 'transparent');
                    ctx.fillStyle = glow;
                    ctx.fillRect(x - radius * 8, y - radius * 8, radius * 16, radius * 16);
                }
                
                // 十字星芒（极亮星）
                if (Math.random() > 0.997) {
                    ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.8})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x - radius * 12, y);
                    ctx.lineTo(x + radius * 12, y);
                    ctx.moveTo(x, y - radius * 12);
                    ctx.lineTo(x, y + radius * 12);
                    ctx.stroke();
                }
            }
            
            // 添加6层星云
            for (let i = 0; i < 6; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const radius = Math.random() * 400 + 200;
                const color = config.galaxyColors[Math.floor(Math.random() * config.galaxyColors.length)];
                
                const nebula = ctx.createRadialGradient(x, y, 0, x, y, radius);
                nebula.addColorStop(0, color + '25');
                nebula.addColorStop(0.5, color + '15');
                nebula.addColorStop(1, 'transparent');
                ctx.fillStyle = nebula;
                ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
            }
        }

        // 创建照片球体
        function createPhotoSphere() {
            const geometry = new THREE.SphereGeometry(config.radius, 64, 64);
            const positions = geometry.attributes.position.array;
            
            // 使用斐波那契螺旋分布照片
            const goldenRatio = (1 + Math.sqrt(5)) / 2;
            const photoIndices = [];
            
            for (let i = 0; i < config.photoCount; i++) {
                const y = 1 - (i / (config.photoCount - 1)) * 2;
                const radius = Math.sqrt(1 - y * y);
                const theta = goldenRatio * i * Math.PI * 2;
                
                const x = Math.cos(theta) * radius;
                const z = Math.sin(theta) * radius;
                
                // 找到最近的顶点
                let minDist = Infinity;
                let minIndex = 0;
                
                for (let j = 0; j < positions.length / 3; j++) {
                    const dx = positions[j * 3] - x * config.radius;
                    const dy = positions[j * 3 + 1] - y * config.radius;
                    const dz = positions[j * 3 + 2] - z * config.radius;
                    const dist = dx * dx + dy * dy + dz * dz;
                    
                    if (dist < minDist) {
                        minDist = dist;
                        minIndex = j;
                    }
                }
                
                photoIndices.push(minIndex);
            }
            
            // 创建照片
            photoIndices.forEach((index, i) => {
                const x = positions[index * 3];
                const y = positions[index * 3 + 1];
                const z = positions[index * 3 + 2];
                
                createAdvancedPhoto(x, y, z, i);
            });
        }

        // 绘制高级心形
        function drawAdvancedHeart(ctx, x, y, size) {
            ctx.beginPath();
            ctx.moveTo(x, y + size / 4);
            
            // 左侧曲线
            ctx.bezierCurveTo(
                x, y - size / 4,
                x - size / 2, y - size / 4,
                x - size / 2, y
            );
            
            // 左侧圆形
            ctx.bezierCurveTo(
                x - size / 2, y + size / 4,
                x, y + size / 2,
                x, y + size
            );
            
            // 右侧圆形
            ctx.bezierCurveTo(
                x, y + size / 2,
                x + size / 2, y + size / 4,
                x + size / 2, y
            );
            
            // 右侧曲线
            ctx.bezierCurveTo(
                x + size / 2, y - size / 4,
                x, y - size / 4,
                x, y + size / 4
            );
            
            ctx.fill();
        }

        // 创建高级粒子系统
        function createAdvancedParticleSystem() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(config.particleCount * 3);
            const colors = new Float32Array(config.particleCount * 3);
            const sizes = new Float32Array(config.particleCount);
            const velocities = new Float32Array(config.particleCount * 3);
            
            for (let i = 0; i < config.particleCount; i++) {
                const i3 = i * 3;
                
                // 球形分布
                const radius = config.radius + Math.random() * 300 - 150;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                
                positions[i3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i3 + 2] = radius * Math.cos(phi);
                
                // 彩虹色彩
                const color = new THREE.Color().setHSL((i / config.particleCount + Math.random() * 0.1) % 1, 0.8, 0.7);
                colors[i3] = color.r;
                colors[i3 + 1] = color.g;
                colors[i3 + 2] = color.b;
                
                // 随机大小
                sizes[i] = Math.random() * 4 + 1;
                
                // 随机速度
                velocities[i3] = (Math.random() - 0.5) * 0.02;
                velocities[i3 + 1] = (Math.random() - 0.5) * 0.02;
                velocities[i3 + 2] = (Math.random() - 0.5) * 0.02;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
            
            const material = new THREE.PointsMaterial({
                size: 3,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });
            
            const particleSystem = new THREE.Points(geometry, material);
            particleGroup.add(particleSystem);
            particles.push(particleSystem);
        }

                    side: THREE.DoubleSide
                });
                
                const ring = new THREE.Mesh(geometry, material);
                ring.rotation.x = Math.random() * Math.PI;
                ring.rotation.y = Math.random() * Math.PI;
                ring.rotation.z = Math.random() * Math.PI;
                
                orbitGroup.add(ring);
            }
        }
        
        // 创建永恒之心
        function createEternalHeart() {
            const heartShape = new THREE.Shape();
            const x = 0, y = 0;
            const size = 30;
            
            heartShape.moveTo(x, y + size / 4);
            heartShape.bezierCurveTo(x, y - size / 4, x - size / 2, y - size / 4, x - size / 2, y);
            heartShape.bezierCurveTo(x - size / 2, y + size / 4, x, y + size / 2, x, y + size);
            heartShape.bezierCurveTo(x, y + size / 2, x + size / 2, y + size / 4, x + size / 2, y);
            heartShape.bezierCurveTo(x + size / 2, y - size / 4, x, y - size / 4, x, y + size / 4);
            
            const geometry = new THREE.ExtrudeGeometry(heartShape, {
                depth: 10,
                bevelEnabled: true,
                bevelSegments: 8,
                steps: 2,
                bevelSize: 3,
                bevelThickness: 3
            });
            
            const material = new THREE.MeshStandardMaterial({
                color: 0xff69b4,
                emissive: 0xff1493,
                emissiveIntensity: 0.3,
                roughness: 0.2,
                metalness: 0.8,
                transparent: true,
                opacity: 0.9
            });
            
            const heart = new THREE.Mesh(geometry, material);
            heart.position.set(0, 0, 0);
            heart.scale.set(2, 2, 2);
            
            heartGroup.add(heart);
            
            // 心脏光环
            const ringGeometry = new THREE.TorusGeometry(80, 5, 16, 100);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: 0xff1493,
                transparent: true,
                opacity: 0.3
            });
            
            const heartRing = new THREE.Mesh(ringGeometry, ringMaterial);
            heartRing.rotation.x = Math.PI / 2;
            heartGroup.add(heartRing);
        }
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;
            
            // 自动旋转
            if (autoRotate) {
                photoGroup.rotation.y += config.autoRotateSpeed * 0.01;
                auraGroup.rotation.y += config.autoRotateSpeed * 0.01;
                orbitGroup.rotation.y += config.autoRotateSpeed * 0.005;
            }
            
            // 粒子动画
            particles.forEach(particle => {
                particle.rotation.y += 0.003;
                particle.rotation.x += 0.001;
                
                // 更新粒子位置
                const positions = particle.geometry.attributes.position.array;
                const velocities = particle.geometry.attributes.velocity.array;
                
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i] += velocities[i];
                    positions[i + 1] += velocities[i + 1];
                    positions[i + 2] += velocities[i + 2];
                    
                    // 边界检查
                    const dist = Math.sqrt(positions[i] ** 2 + positions[i + 1] ** 2 + positions[i + 2] ** 2);
                    if (dist > config.radius + 300 || dist < config.radius - 300) {
                        velocities[i] *= -1;
                        velocities[i + 1] *= -1;
                        velocities[i + 2] *= -1;
                    }
                }
                
                particle.geometry.attributes.position.needsUpdate = true;
            });
            
            // 轨道环动画
            orbitGroup.rotation.y += 0.002;
            orbitGroup.rotation.x += 0.001;
            orbitGroup.rotation.z += 0.0005;
            
            // 光环动画
            auras.forEach((aura, index) => {
                aura.rotation.z += 0.03 * (index % 2 === 0 ? 1 : -1);
                const pulse = Math.sin(time * 2 + index * 0.5) * 0.15 + 0.3;
                aura.material.opacity = pulse;
                
                // 颜色变化
                const hue = (time * 10 + index * 30) % 360;
                aura.material.color.setHSL(hue / 360, 0.7, 0.6);
            });
            
            // 心脏动画
            if (heartGroup.children.length > 0) {
                const heart = heartGroup.children[0];
                const ring = heartGroup.children[1];
                
                heart.rotation.y = time * 0.5;
                heart.position.y = Math.sin(time * 2) * 10;
                
                ring.rotation.z = time * 0.3;
                ring.scale.setScalar(1 + Math.sin(time * 3) * 0.1);
            }
            
            // 心跳模式
            if (isHeartbeatMode) {
                const heartbeat = Math.sin(time * 8) * 0.5 + 0.5;
                lights[0].intensity = 0.5 + heartbeat * 1.0;
                
                photos.forEach((photo, index) => {
                    const scale = 1 + heartbeat * 0.15;
                    photo.scale.set(scale, scale, scale);
                    
                    // 发光强度变化
                    photo.material.emissiveIntensity = heartbeat * 0.3;
                });
            }
            
            // 平滑旋转
            photoGroup.rotation.x += (targetRotationX - photoGroup.rotation.x) * 0.03;
            photoGroup.rotation.y += (targetRotationY - photoGroup.rotation.y) * 0.03;
            
            renderer.render(scene, camera);
        }
        
        // 事件监听
        function initEvents() {
            // 窗口大小调整
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                createStarField();
            });
            
            // 鼠标移动
            document.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
                
                targetRotationY = mouseX * 0.5;
                targetRotationX = mouseY * 0.5;
            });
            
            // 鼠标点击
            renderer.domElement.addEventListener('click', onPhotoClick);
            
            // 控制按钮
            document.getElementById('btn-rotate').addEventListener('click', toggleAutoRotate);
            document.getElementById('btn-stats').addEventListener('click', toggleStats);
            document.getElementById('btn-random').addEventListener('click', showRandomPhoto);
            document.getElementById('btn-mood').addEventListener('click', changeMood);
            document.getElementById('btn-light').addEventListener('click', toggleLights);
            document.getElementById('btn-heartbeat').addEventListener('click', toggleHeartbeat);
            document.getElementById('btn-customizer').addEventListener('click', openCustomizer);
            document.getElementById('btn-upload').addEventListener('click', uploadPhoto);
            
            // 照片查看器关闭
            document.getElementById('viewer-close').addEventListener('click', closePhotoViewer);
            document.getElementById('photo-viewer').addEventListener('click', (e) => {
                if (e.target.id === 'photo-viewer') closePhotoViewer();
            });
            
            // 魔法粒子
            magicParticleInterval = setInterval(createMagicParticle, 800);
        }
        
        // 照片点击
        function onPhotoClick(event) {
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(photos);
            if (intersects.length > 0) {
                const photo = intersects[0].object;
                showPhotoViewer(photo.userData);
                
                // 添加点击效果
                createClickEffect(photo.position, photo.userData.heartColor);
                
                // 照片动画
                const originalScale = photo.userData.originalScale;
                photo.scale.set(originalScale * 1.2, originalScale * 1.2, originalScale * 1.2);
                setTimeout(() => {
                    photo.scale.set(originalScale, originalScale, originalScale);
                }, 300);
            }
        }
        
        // 创建点击效果
        function createClickEffect(position, color) {
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.style.cssText = `
                        position: absolute;
                        width: 8px;
                        height: 8px;
                        background: radial-gradient(circle, ${color}, transparent);
                        border-radius: 50%;
                        pointer-events: none;
                        left: 50%;
                        top: 50%;
                        transform: translate(-50%, -50%);
                        animation: particleBurst 1.5s ease-out forwards;
                    `;
                    
                    const style = document.createElement('style');
                    style.textContent = `
                        @keyframes particleBurst {
                            0% {
                                transform: translate(-50%, -50%) translate(0, 0) scale(1);
                                opacity: 1;
                            }
                            100% {
                                transform: translate(-50%, -50%) translate(${(Math.random() - 0.5) * 200}px, ${(Math.random() - 0.5) * 200}px) scale(0);
                                opacity: 0;
                            }
                        }
                    `;
                    document.head.appendChild(style);
                    document.body.appendChild(particle);
                    
                    setTimeout(() => {
                        if (particle.parentNode) particle.parentNode.removeChild(particle);
                        if (style.parentNode) style.parentNode.removeChild(style);
                    }, 1500);
                }, i * 50);
            }
        }
        
        // 显示照片查看器
        function showPhotoViewer(photoData) {
            const viewer = document.getElementById('photo-viewer');
            const image = document.getElementById('viewer-image');
            const date = document.getElementById('viewer-date');
            const caption = document.getElementById('viewer-caption');
            
            // 生成高质量照片
            const canvas = document.createElement('canvas');
            canvas.width = 1200;
            canvas.height = 800;
            const ctx = canvas.getContext('2d');
            
            // 绘制浪漫背景
            const gradient = ctx.createLinearGradient(0, 0, 1200, 800);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 1200, 800);
            
            // 绘制装饰心形
            ctx.fillStyle = photoData.heartColor;
            ctx.shadowColor = photoData.heartColor;
            ctx.shadowBlur = 40;
            drawAdvancedHeart(ctx, 600, 400, 150);
            ctx.shadowBlur = 0;
            
            // 添加大emoji
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.font = '300px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(config.emojis[photoData.index % config.emojis.length], 600, 400);
            
            // 添加序号
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = '48px serif';
            ctx.fillText(`#${photoData.index + 1}`, 100, 100);
            
            image.src = canvas.toDataURL();
            
            // 格式化日期
            const dateStr = photoData.date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            date.textContent = `📅 ${dateStr}`;
            caption.textContent = photoData.caption;
            
            viewer.style.display = 'flex';
            
            // 添加心跳背景
            document.getElementById('heartbeat-bg').classList.add('active');
        }
        
        // 关闭照片查看器
        function closePhotoViewer() {
            document.getElementById('photo-viewer').style.display = 'none';
            document.getElementById('heartbeat-bg').classList.remove('active');
        }
        
        // 切换自动旋转
        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            const btn = document.getElementById('btn-rotate');
            btn.classList.toggle('active');
            
            if (autoRotate) {
                btn.innerHTML = '<span>⏸️</span><span>停止流转</span>';
                showToast('🌙 星轨流转已开启');
            } else {
                btn.innerHTML = '<span>🌙</span><span>星轨流转</span>';
                showToast('🌙 星轨流转已停止');
            }
        }
        
        // 切换统计面板
        function toggleStats() {
            const panel = document.getElementById('stats-panel');
            const isVisible = panel.style.display === 'block';
            panel.style.display = isVisible ? 'none' : 'block';
            
            if (!isVisible) {
                updateStats();
                showToast('📜 时光卷轴已展开');
            } else {
                showToast('📜 时光卷轴已收起');
            }
        }
        
        // 更新统计
        function updateStats() {
            const now = new Date();
            const days = Math.floor((now - config.startDate) / (1000 * 60 * 60 * 24));
            
            document.getElementById('days-count').textContent = days;
            document.getElementById('photo-count').textContent = config.photoCount;
            
            // 计算甜蜜指数（基于天数和照片数）
            const sweetIndex = Math.min(99, Math.floor((days / 365) * 50 + (config.photoCount / 100) * 50));
            document.getElementById('sweet-index').textContent = sweetIndex;
        }
        
        // 显示随机照片
        function showRandomPhoto() {
            const randomIndex = Math.floor(Math.random() * photos.length);
            const photo = photos[randomIndex];
            showPhotoViewer(photo.userData);
            
            // 高亮照片
            const originalEmissive = photo.material.emissiveIntensity;
            photo.material.emissiveIntensity = 0.5;
            setTimeout(() => {
                photo.material.emissiveIntensity = originalEmissive;
            }, 1000);
            
            showToast('🎲 随机回忆已加载');
        }
        
        // 改变氛围
        function changeMood() {
            currentMood = (currentMood + 1) % config.moods.length;
            const mood = config.moods[currentMood];
            
            // 改变背景
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 0,
                canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height)
            );
            
            mood.colors.forEach((color, index) => {
                gradient.addColorStop(index / (mood.colors.length - 1), color);
            });
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 重新绘制星星
            createStarField();
            
            // 改变光源颜色
            lights.forEach((light, index) => {
                if (index > 0) {
                    const colorIndex = (currentMood + index - 1) % mood.colors.length;
                    light.color.set(mood.colors[colorIndex]);
                }
            });
            
            showToast(`🎨 氛围切换：${mood.name} - ${mood.description}`);
        }
        
        // 切换灯光
        function toggleLights() {
            lights.forEach(light => {
                light.visible = !light.visible;
            });
            
            const btn = document.getElementById('btn-light');
            btn.classList.toggle('active');
            
            showToast(lights[0].visible ? '💫 星光已点亮' : '💫 星光已熄灭');
        }
        
        // 切换心跳模式
        function toggleHeartbeat() {
            isHeartbeatMode = !isHeartbeatMode;
            const btn = document.getElementById('btn-heartbeat');
            btn.classList.toggle('active');
            
            if (isHeartbeatMode) {
                document.getElementById('heartbeat-bg').classList.add('active');
                showToast('💕 心跳同步已开启 - 感受我的心跳');
            } else {
                document.getElementById('heartbeat-bg').classList.remove('active');
                showToast('💕 心跳同步已关闭');
                
                // 重置照片发光
                photos.forEach(photo => {
                    photo.material.emissiveIntensity = 0.1;
                });
            }
        }
        
        // 打开定制器
        function openCustomizer() {
            showToast('💎 永恒之心定制器即将开放，敬请期待！');
        }
        
        // 上传照片
        function uploadPhoto() {
            showToast('📸 照片上传功能即将开放，敬请期待！');
        }
        
        // 显示提示
        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(30px);
                color: white;
                padding: 25px 40px;
                border-radius: 25px;
                font-size: 18px;
                z-index: 1000;
                border: 1px solid rgba(255, 255, 255, 0.2);
                box-shadow: 0 15px 50px rgba(155, 181, 255, 0.3);
                animation: toastFade 3.5s ease-in-out forwards;
                font-family: 'Noto Serif SC', serif;
                text-align: center;
                max-width: 80%;
                font-weight: 400;
                letter-spacing: 1px;
            `;
            toast.textContent = message;
            
            const style = document.createElement('style');
            style.textContent = `
                @keyframes toastFade {
                    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
                    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
                    85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
                }
            `;
            document.head.appendChild(style);
            document.body.appendChild(toast);
            
            setTimeout(() => {
                if (toast.parentNode) toast.parentNode.removeChild(toast);
                if (style.parentNode) style.parentNode.removeChild(style);
            }, 3500);
        }
        
        // 初始化
        function init() {
            createStarField();
            initScene();
            initEvents();
            updateStats();
            
            // 隐藏加载界面
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
            }, 3000);
            
            // 显示手势提示
            setTimeout(() => {
                const hint = document.getElementById('gesture-hint');
                hint.style.display = 'block';
                setTimeout(() => {
                    hint.style.display = 'none';
                }, 6000);
            }, 4000);
            
            // 轮换加载引言
            let quoteIndex = 0;
            setInterval(() => {
                if (document.getElementById('loading-screen').style.display !== 'none') {
                    document.getElementById('loading-quote').textContent = loadingQuotes[quoteIndex];
                    quoteIndex = (quoteIndex + 1) % loadingQuotes.length;
                }
            }, 4000);
        }
        
        // 启动
        init();
    </script>
</body>
</html>
