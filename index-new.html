<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">我们的小宇宙 - 3D照片星球</title>
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a2a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/css/main.css">
    
    <style>
        /* CSS Variables for theming */
        :root {
            --primary-color: #9bb5ff;
            --secondary-color: #ff69b4;
            --panel-bg: rgba(10, 10, 42, 0.9);
            --text-color: #9bb5ff;
            --text-secondary: rgba(155, 181, 255, 0.7);
            --border-color: rgba(155, 181, 255, 0.3);
            --shadow-color: rgba(155, 181, 255, 0.2);
            --glow-color: rgba(155, 181, 255, 0.5);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a2a 0%, #000814 50%, #000000 100%);
            color: var(--text-color);
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* 密码验证界面 */
        #password-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a2a 0%, #000814 50%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease-out;
        }
        
        .password-container {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        
        .password-title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px var(--glow-color);
        }
        
        .password-subtitle {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.8;
            line-height: 1.6;
        }
        
        .password-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .password-field {
            text-align: left;
        }
        
        .password-field label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .password-field select,
        .password-field input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .password-field select:focus,
        .password-field input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 10px var(--shadow-color);
        }
        
        .word-selection {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .word-btn {
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .word-btn:hover {
            border-color: var(--primary-color);
            background: rgba(155, 181, 255, 0.1);
        }
        
        .word-btn.selected {
            background: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
        }
        
        .enter-btn {
            margin-top: 20px;
            padding: 15px 30px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .enter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px var(--shadow-color);
        }
        
        .enter-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }
        
        .enter-btn:hover::before {
            left: 100%;
        }
        
        /* 主容器 */
        #main-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        
        /* 标题 */
        #title-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }
        
        .main-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px var(--glow-color);
            margin-bottom: 5px;
        }
        
        .subtitle {
            font-size: 1rem;
            opacity: 0.8;
            font-weight: 300;
        }
        
        /* 统计面板 */
        #stats-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            z-index: 1000;
            backdrop-filter: blur(10px);
            display: none;
            min-width: 200px;
        }
        
        #stats-panel.show {
            display: block;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        
        .stat-emoji {
            font-size: 1.2rem;
        }
        
        /* 控制面板 */
        #control-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            z-index: 1000;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90%;
        }
        
        .control-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            min-width: 70px;
            text-align: center;
        }
        
        .control-btn:hover {
            border-color: var(--primary-color);
            background: rgba(155, 181, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .control-btn span:first-child {
            font-size: 1.2rem;
        }
        
        .control-btn span:last-child {
            font-size: 0.7rem;
            opacity: 0.9;
        }
        
        /* 照片查看器 */
        #photo-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        #photo-viewer.show {
            display: flex;
        }
        
        #viewer-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            z-index: 2001;
        }
        
        #viewer-image {
            max-width: 90%;
            max-height: 80%;
            border-radius: 8px;
        }
        
        #viewer-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
        }
        
        /* 手势提示 */
        #gesture-hint {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 0.9rem;
            z-index: 500;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        
        #gesture-hint.show {
            opacity: 1;
        }
        
        .hint-icon {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        
        /* 加载动画 */
        .loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
        }
        
        .loader-circle {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 控制面板分组 */
        .control-btn-group {
            display: flex;
            gap: 10px;
        }
        
        /* 更多按钮（默认隐藏） */
        .more-btn {
            display: none;
            background: rgba(155, 181, 255, 0.2);
            border-color: var(--primary-color);
        }
        
        /* 折叠菜单 */
        .collapse-menu {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 1001;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease-out;
        }
        
        .collapse-menu.show {
            display: flex;
        }
        
        .collapse-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            min-width: 120px;
        }
        
        .collapse-btn:hover {
            border-color: var(--primary-color);
            background: rgba(155, 181, 255, 0.1);
        }
        
        .collapse-btn span:first-child {
            font-size: 1rem;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-title {
                font-size: 1.8rem;
            }
            
            .password-title {
                font-size: 2rem;
            }
            
            #stats-panel {
                top: 10px;
                left: 10px;
                padding: 15px;
            }
            
            #control-panel {
                bottom: 10px;
                padding: 8px;
                gap: 6px;
                max-width: 95%;
            }
            
            .control-btn {
                padding: 8px 10px;
                font-size: 0.7rem;
                min-width: 60px;
            }
            
            .control-btn span:first-child {
                font-size: 1rem;
            }
            
            .control-btn span:last-child {
                font-size: 0.6rem;
            }
        }
        
        @media (max-width: 480px) {
            /* 移动端：隐藏次要按钮组，显示更多按钮 */
            .control-btn-group {
                display: none;
            }
            
            .more-btn {
                display: flex;
            }
            
            #control-panel {
                flex-wrap: nowrap;
                gap: 4px;
                padding: 6px;
                justify-content: space-around;
            }
            
            .control-btn {
                padding: 6px 8px;
                font-size: 0.6rem;
                min-width: 55px;
                flex: 1;
            }
            
            .control-btn.primary {
                flex: 1.5; /* 主要按钮稍大 */
            }
        }
    </style>
</head>
<body>
    <!-- 密码验证界面 -->
    <div id="password-screen">
        <div class="password-container">
            <h1 class="password-title" id="password-title">我们的小宇宙</h1>
            <p class="password-subtitle" id="password-subtitle">请输入密码，进入我们的专属空间</p>
            
            <form class="password-form" id="password-form">
                <div class="password-field">
                    <label id="month-label">第一次见面的月份</label>
                    <select id="month-select" required>
                        <option value="">请选择月份</option>
                        <option value="1">一月</option>
                        <option value="2">二月</option>
                        <option value="3">三月</option>
                        <option value="4">四月</option>
                        <option value="5">五月</option>
                        <option value="6">六月</option>
                        <option value="7">七月</option>
                        <option value="8">八月</option>
                        <option value="9">九月</option>
                        <option value="10">十月</option>
                        <option value="11">十一月</option>
                        <option value="12">十二月</option>
                    </select>
                </div>
                
                <div class="password-field">
                    <label id="nickname-label">昵称</label>
                    <input type="text" id="nickname-input" placeholder="输入昵称" required>
                </div>
                
                <div class="password-field">
                    <label id="word-label">选择心动词</label>
                    <div class="word-selection" id="word-selection">
                        <button type="button" class="word-btn" data-word="星星">⭐ 星星</button>
                        <button type="button" class="word-btn" data-word="月亮">🌙 月亮</button>
                        <button type="button" class="word-btn" data-word="太阳">☀️ 太阳</button>
                        <button type="button" class="word-btn" data-word="宇宙">🌌 宇宙</button>
                    </div>
                    <input type="hidden" id="word-selected" required>
                </div>
                
                <button type="submit" class="enter-btn" id="enter-btn">进入宇宙</button>
            </form>
        </div>
    </div>
    
    <!-- 主容器 -->
    <div id="main-container">
        <div id="canvas-container"></div>
        
        <!-- 标题 -->
        <div id="title-container">
            <h1 class="main-title">我们的小宇宙</h1>
            <p class="subtitle">在星辰大海中，收藏我们的时光</p>
        </div>
        
        <!-- 统计面板 -->
        <div id="stats-panel">
            <div class="stat-item">
                <span class="stat-emoji">📅</span>
                <span>在一起 <span id="days-count">0</span> 天</span>
            </div>
            <div class="stat-item">
                <span class="stat-emoji">📸</span>
                <span>共 <span id="photo-count">0</span> 张照片</span>
            </div>
            <div class="stat-item">
                <span class="stat-emoji">❤️</span>
                <span>甜蜜指数 <span id="sweet-index">99</span>%</span>
            </div>
        </div>
        
        <!-- 控制面板 -->
        <div id="control-panel">
            <!-- 主要操作（始终显示） -->
            <button class="control-btn primary" id="btn-rotate">
                <span>🔄</span>
                <span>自动旋转</span>
            </button>
            <button class="control-btn primary" id="btn-random">
                <span>🎲</span>
                <span>随机看看</span>
            </button>
            <button class="control-btn primary" id="btn-upload">
                <span>📸</span>
                <span>上传照片</span>
            </button>
            
            <!-- 次要操作（桌面端显示，移动端折叠） -->
            <div class="control-btn-group" id="control-btn-group">
                <button class="control-btn" id="btn-stats">
                    <span>📊</span>
                    <span>统计</span>
                </button>
                <button class="control-btn" id="btn-mood">
                    <span>🎨</span>
                    <span>换个心情</span>
                </button>
                <button class="control-btn" id="btn-light">
                    <span>💡</span>
                    <span>切换光效</span>
                </button>
                <button class="control-btn" id="btn-surprise">
                    <span>🎉</span>
                    <span>小惊喜</span>
                </button>
            </div>
            
            <!-- 更多按钮（移动端显示） -->
            <button class="control-btn more-btn" id="btn-more">
                <span>⋮</span>
                <span>更多</span>
            </button>
        </div>
        
        <!-- 折叠菜单（移动端） -->
        <div id="collapse-menu" class="collapse-menu">
            <button class="collapse-btn" id="btn-stats-collapse">
                <span>📊</span>
                <span>统计</span>
            </button>
            <button class="collapse-btn" id="btn-mood-collapse">
                <span>🎨</span>
                <span>换个心情</span>
            </button>
            <button class="collapse-btn" id="btn-light-collapse">
                <span>💡</span>
                <span>切换光效</span>
            </button>
            <button class="collapse-btn" id="btn-surprise-collapse">
                <span>🎉</span>
                <span>小惊喜</span>
            </button>
        </div>
        
        <!-- 照片查看器 -->
        <div id="photo-viewer">
            <div id="viewer-close">×</div>
            <img id="viewer-image" src="" alt="">
            <div id="viewer-info">
                <div id="viewer-date"></div>
                <div id="viewer-caption"></div>
            </div>
        </div>
        
        <!-- 手势提示 -->
        <div id="gesture-hint">
            <div class="hint-icon">👆</div>
            <div>滑动旋转星球，双指缩放视角</div>
        </div>
    </div>
    
    <!-- 上传模态框模板 -->
    <template id="upload-modal-template">
        <div id="uploadModal" class="upload-modal">
            <div class="upload-modal-content">
                <div class="upload-modal-header">
                    <h3>📸 添加新照片</h3>
                    <button class="upload-modal-close">&times;</button>
                </div>
                
                <div class="upload-modal-body">
                    <div class="upload-drop-zone" id="uploadDropZone">
                        <div class="upload-icon">☁️</div>
                        <h4>拖拽照片到这里</h4>
                        <p>或点击选择文件</p>
                        <input type="file" id="uploadFileInput" multiple accept="image/*" style="display: none;">
                        <button class="btn-upload-select">选择文件</button>
                    </div>
                    
                    <div class="upload-preview" id="uploadPreview" style="display: none;">
                        <h4>待上传照片</h4>
                        <div class="upload-preview-grid" id="uploadPreviewGrid"></div>
                    </div>
                    
                    <div class="upload-progress" id="uploadProgress" style="display: none;">
                        <div class="progress-bar">
                            <div class="progress-fill" id="uploadProgressFill"></div>
                        </div>
                        <div class="progress-text" id="uploadProgressText">准备上传...</div>
                    </div>
                </div>
                
                <div class="upload-modal-footer">
                    <button class="btn btn-secondary" id="uploadCancelBtn">取消</button>
                    <button class="btn btn-primary" id="uploadStartBtn" disabled>开始上传</button>
                </div>
            </div>
        </div>
    </template>
    
    <!-- 加载动画 -->
    <div class="loader" id="loader" style="display: none;">
        <div class="loader-circle"></div>
    </div>
    
    <!-- 应用模块（依赖在app.js中集中导入） -->
    <script type="module" src="/js/config.js"></script>
    <script type="module" src="/js/core/DependencyManager.js"></script>
    <script type="module" src="/js/core/ThemeManager.js"></script>
    <script type="module" src="/js/managers/RenderManager.js"></script>
    <script type="module" src="/js/managers/SceneManager.js"></script>
    <script type="module" src="/js/managers/PhotoManager.js"></script>
    <script type="module" src="/js/managers/ParticleManager.js"></script>
    <script type="module" src="/js/app.js"></script>
    
    <!-- 应用启动脚本 -->
    <script type="module">
        import PhotoSphereApp from '/js/app.js';
        import ThemeManager from '/js/core/ThemeManager.js';
        
        // 应用启动
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log('🌌 启动我们的小宇宙...');
                
                // 检查必要的依赖
                if (typeof THREE === 'undefined') {
                    throw new Error('Three.js 加载失败');
                }
                
                // 初始化主题管理器
                const themeManager = new ThemeManager();
                await themeManager.initialize();
                
                // 根据URL参数或默认设置主题
                const urlParams = new URLSearchParams(window.location.search);
                const theme = urlParams.get('theme') || 'default';
                themeManager.switchTheme(theme);
                
                // 创建并初始化应用
                const app = new PhotoSphereApp();
                await app.initialize();
                
                // 启动渲染循环
                app.start();
                
                console.log('✨ 我们的小宇宙已准备就绪！');
                
            } catch (error) {
                console.error('💥 应用启动失败:', error);
                
                // 显示错误信息
                const errorEl = document.createElement('div');
                errorEl.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: #ef4444;
                    color: white;
                    padding: 20px;
                    border-radius: 10px;
                    text-align: center;
                    z-index: 9999;
                    font-family: 'Noto Sans SC', Arial, sans-serif;
                `;
                errorEl.innerHTML = `
                    <h3>💔 初始化失败</h3>
                    <p>${error.message}</p>
                    <button onclick="location.reload()" style="
                        background: white;
                        color: #ef4444;
                        border: none;
                        padding: 10px 20px;
                        border-radius: 5px;
                        margin-top: 10px;
                        cursor: pointer;
                    ">重新加载</button>
                `;
                document.body.appendChild(errorEl);
            }
        });
        
        // 服务工作器注册 (PWA)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
        
        // 性能监控
        if (window.performance && window.performance.measure) {
            window.addEventListener('load', () => {
                setTimeout(() => {
                    const perfData = performance.getEntriesByType('navigation')[0];
                    console.log('⚡ 页面加载性能:', {
                        domContentLoaded: Math.round(perfData.domContentLoadedEventEnd - perfData.domContentLoadedEventStart),
                        pageLoad: Math.round(perfData.loadEventEnd - perfData.loadEventStart),
                        totalTime: Math.round(perfData.loadEventEnd - perfData.fetchStart)
                    });
                }, 0);
            });
        }
        
        // 全局错误处理
        window.addEventListener('error', (event) => {
            console.error('全局错误:', event.error);
        });
        
        window.addEventListener('unhandledrejection', (event) => {
            console.error('未处理的Promise拒绝:', event.reason);
        });
    </script>
</body>
</html>
